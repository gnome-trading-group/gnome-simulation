name: tif_fok_with_liquidity
description: >-
  FOK limit orders against a book with liquidity. A FOK that cannot fill in full is rejected and takes
  nothing; one that fills takes its liquidity, so the next FOK sees only what is left.
initial_levels:
  - ask_px: 102
    ask_sz: 10
  - bid_px: 98
    bid_sz: 8

events:

  # ============================================================
  # FOK buy against ask 102/10
  # ============================================================

  # 15 > 10 available → REJECT, and nothing is taken
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 15
      client_oid: FOK_BID_1
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: FOK_BID_1

  # 6 of the full 10 → FILL
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 6
      client_oid: FOK_BID_2
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: FOK_BID_2
        filled_qty: 6
        leaves_qty: 0
        cumulative_qty: 6

  # 5 > the 4 left → REJECT
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 5
      client_oid: FOK_BID_3
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: FOK_BID_3

  # Exactly the 4 left → FILL
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 4
      client_oid: FOK_BID_4
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: FOK_BID_4
        filled_qty: 4
        leaves_qty: 0
        cumulative_qty: 4

  # ============================================================
  # FOK sell against bid 98/8
  # ============================================================

  # 12 > 8 available → REJECT, and nothing is taken
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 12
      client_oid: FOK_ASK_1
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: FOK_ASK_1

  # 5 of the full 8 → FILL
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 5
      client_oid: FOK_ASK_2
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: FOK_ASK_2
        filled_qty: 5
        leaves_qty: 0
        cumulative_qty: 5

  # 4 > the 3 left → REJECT
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 4
      client_oid: FOK_ASK_3
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: FOK_ASK_3

  # Exactly the 3 left → FILL
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 3
      client_oid: FOK_ASK_4
      order_type: LIMIT
      tif: FOK
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: FOK_ASK_4
        filled_qty: 3
        leaves_qty: 0
        cumulative_qty: 3
