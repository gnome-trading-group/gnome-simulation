name: market_order_with_liquidity
description: >-
  Market orders against a book with resting liquidity.
  Tests: full fill (single level), partial fill across levels, and rejection once every level has been
  taken, on both sides. Liquidity taken by one order is not offered to the next.
  Partial fills produce 2 reports (PARTIAL_FILL + CANCEL); full fills produce 1 (FILL).
initial_levels:
  - ask_px: 102
    ask_sz: 10
  - ask_px: 103
    ask_sz: 15
  - bid_px: 98
    bid_sz: 8
  - bid_px: 97
    bid_sz: 12

events:

  # ============================================================
  # MARKET BUY — full fill, single level (8 <= ask 102/10)
  # ============================================================
  - type: submit_order
    order:
      side: Bid
      price: 0
      size: 8
      client_oid: MKT_BID_1
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: MKT_BID_1
        filled_qty: 8
        leaves_qty: 0
        cumulative_qty: 8

  # MARKET BUY — partial fill across levels (17 left = ask 102/2 + ask 103/15); PARTIAL_FILL + CANCEL
  - type: submit_order
    order:
      side: Bid
      price: 0
      size: 20
      client_oid: MKT_BID_2
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: PARTIAL_FILL
        order_status: PARTIALLY_FILLED
        client_oid: MKT_BID_2
        filled_qty: 17
        leaves_qty: 3
        cumulative_qty: 17
      - exec_type: CANCEL
        order_status: CANCELED
        client_oid: MKT_BID_2
        filled_qty: 0
        leaves_qty: 0
        cumulative_qty: 17

  # MARKET BUY — every ask has been taken: rejected for no liquidity
  - type: submit_order
    order:
      side: Bid
      price: 0
      size: 30
      client_oid: MKT_BID_3
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: MKT_BID_3

  # ============================================================
  # MARKET SELL — full fill, single level (5 <= bid 98/8)
  # ============================================================
  - type: submit_order
    order:
      side: Ask
      price: 0
      size: 5
      client_oid: MKT_ASK_1
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: MKT_ASK_1
        filled_qty: 5
        leaves_qty: 0
        cumulative_qty: 5

  # MARKET SELL — full fill, multi-level (15 = bid 98/3 left + bid 97/12)
  - type: submit_order
    order:
      side: Ask
      price: 0
      size: 15
      client_oid: MKT_ASK_2
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: MKT_ASK_2
        filled_qty: 15
        leaves_qty: 0
        cumulative_qty: 15

  # MARKET SELL — every bid has been taken: rejected for no liquidity
  - type: submit_order
    order:
      side: Ask
      price: 0
      size: 25
      client_oid: MKT_ASK_3
      order_type: MARKET
      tif: GTC
    expected_reports:
      - exec_type: REJECT
        order_status: REJECTED
        client_oid: MKT_ASK_3
