name: tif_ioc_with_liquidity
description: >-
  IOC limit orders against a book with liquidity.
  Tests full fill (single FILL report) and partial fill
  (PARTIAL_FILL + CANCEL) on both sides. The partial fill gets only what the full fill left.
initial_levels:
  - ask_px: 102
    ask_sz: 10
  - bid_px: 98
    bid_sz: 10

events:

  # ============================================================
  # IOC buy — full fill: size 8 <= ask depth 10
  # ============================================================
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 8
      client_oid: IOC_BID_1
      order_type: LIMIT
      tif: IOC
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: IOC_BID_1
        filled_qty: 8
        leaves_qty: 0
        cumulative_qty: 8

  # IOC buy — partial fill: 2 left after IOC_BID_1 took 8 → PARTIAL_FILL + CANCEL
  - type: submit_order
    order:
      side: Bid
      price: 102
      size: 15
      client_oid: IOC_BID_2
      order_type: LIMIT
      tif: IOC
    expected_reports:
      - exec_type: PARTIAL_FILL
        order_status: PARTIALLY_FILLED
        client_oid: IOC_BID_2
        filled_qty: 2
        leaves_qty: 13
        cumulative_qty: 2
      - exec_type: CANCEL
        order_status: CANCELED
        client_oid: IOC_BID_2
        filled_qty: 0
        leaves_qty: 0
        cumulative_qty: 2

  # ============================================================
  # IOC sell — full fill: size 6 <= bid depth 10
  # ============================================================
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 6
      client_oid: IOC_ASK_1
      order_type: LIMIT
      tif: IOC
    expected_reports:
      - exec_type: FILL
        order_status: FILLED
        client_oid: IOC_ASK_1
        filled_qty: 6
        leaves_qty: 0
        cumulative_qty: 6

  # IOC sell — partial fill: 4 left after IOC_ASK_1 took 6 → PARTIAL_FILL + CANCEL
  - type: submit_order
    order:
      side: Ask
      price: 98
      size: 15
      client_oid: IOC_ASK_2
      order_type: LIMIT
      tif: IOC
    expected_reports:
      - exec_type: PARTIAL_FILL
        order_status: PARTIALLY_FILLED
        client_oid: IOC_ASK_2
        filled_qty: 4
        leaves_qty: 11
        cumulative_qty: 4
      - exec_type: CANCEL
        order_status: CANCELED
        client_oid: IOC_ASK_2
        filled_qty: 0
        leaves_qty: 0
        cumulative_qty: 4
